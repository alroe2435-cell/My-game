<body>

<div id="container">
    <div id="stats-ui">
        <div style="display:flex; justify-content:space-between; align-items:center;">

        </div>
        <div id="choices-bar" class="players-bar"></div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="overlay">
        <div id="setup-menu" class="menu-box">
            <h2 style="margin:0 0 15px 0">Square Race</h2>
            <div class="btn-grid">
                <button class="bet-btn" style="background:#444; color:white" onclick="initPlayers(1)">1 Player</button>
                <button class="bet-btn" style="background:#444; color:white" onclick="initPlayers(2)">2 Players</button>
                <button class="bet-btn" style="background:#444; color:white" onclick="initPlayers(3)">3 Players</button>
                <button class="bet-btn" style="background:#444; color:white" onclick="initPlayers(4)">4 Players</button>
                <button class="bet-btn killer-btn" onclick="startKillerMode()">Killer Mode (100 Squares)</button>
            </div>
        </div>

        <div id="bet-menu" class="menu-box hidden">
            <h2 id="turn-title" style="margin:0 0 15px 0">Player 1: Pick a Color</h2>
            <div class="btn-grid">
                <button class="bet-btn red" onclick="chooseColor('#ff0000')">Red</button>
                <button class="bet-btn blue" onclick="chooseColor('#0000ff')">Blue</button>
                <button class="bet-btn green" onclick="chooseColor('#00ff00')">Green</button>
                <button class="bet-btn yellow" onclick="chooseColor('#ffff00')">Yellow</button>
            </div>
        </div>

        <div id="result-menu" class="menu-box hidden">
            <h1 id="result-title">Race Over!</h1>
            <p id="result-desc"></p>
            <button class="bet-btn" style="background:#4CAF50; color:white; width:100%" onclick="nextGameAction()">Continue</button>
            <button id="rematch-btn" class="bet-btn reset-btn" style="color:white; width:100%" onclick="resetCurrentLevelChoices()">Re-pick</button>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Unified sound function
    function playHitSound(freq = 150) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 380; canvas.height = 680;

    let currentLevel = 1;
    let totalPlayersCount = 1;
    let currentPlayerTurn = 1;
    let playerChoices = [];
    let gameRunning = false;
    let gameMode = 'race'; 
    let killerTimer = 60;
    let killerInterval = null;
    let mouseX = 190, mouseY = 600;

    const levels = [];
    function generateLevels() {
        for(let i=1; i<=100; i++) {
            let walls = [
                {x: 10, y: 10, w: 10, h: 660}, {x: 360, y: 10, w: 10, h: 660},
                {x: 10, y: 10, w: 360, h: 10}, {x: 10, y: 660, w: 360, h: 10}
            ];
            let finish = {x: 160, y: 25, w: 60, h: 40};
            const pattern = i % 5;
            if (pattern === 0) for(let j=0; j<8; j++) walls.push({x: 50 + (j%3)*100, y: 100 + j*60, w: 60, h: 20});
            else if (pattern === 1) {
                for(let j=0; j<6; j++) walls.push({x: j % 2 === 0 ? 10 : 100, y: 100 + j * 90, w: 270, h: 20});
                finish = {x: 20, y: 25, w: 60, h: 40};
            }
            else if (pattern === 2) for(let j=0; j<10; j++) walls.push({x: (j*40) % 300, y: 80 + j*50, w: 100, h: 10});
            else if (pattern === 3) walls.push({x: 100, y: 80, w: 10, h: 500}, {x: 270, y: 80, w: 10, h: 500});
            else { walls.push({x: 80, y: 80, w: 10, h: 500}, {x: 80, y: 580, w: 280, h: 10}); finish = {x: 280, y: 520, w: 60, h: 40}; }
            levels.push({ walls, finish });
        }
    }
    generateLevels();

    class Square {
        constructor(color, isCPU = false, type = 'normal') {
            this.color = color;
            this.isCPU = isCPU;
            this.type = type; 
            this.size = type === 'killer' ? 26 : (type === 'victim' ? 12 : 20);
            this.reset();
        }
        reset() {
            this.x = 180 + (Math.random() * 80 - 40);
            this.y = 625;
            this.dead = false;
            this.finished = false;
            this.speed = (1.6 + (currentLevel * 0.05)) * (this.isCPU ? 0.95 : 1);
            let angle = (Math.random() * 0.5 + 1.25) * Math.PI;
            this.vx = Math.cos(angle) * this.speed;
            this.vy = Math.sin(angle) * this.speed;
            this.trail = [];
        }
        update() {
            if (this.finished || this.dead) return;
            this.trail.push({x: this.x, y: this.y});
            if(this.trail.length > 8) this.trail.shift();

            if (this.type === 'killer') {
                let dx = mouseX - (this.x + this.size/2);
                let dy = mouseY - (this.y + this.size/2);
                this.vx = dx * 0.15;
                this.vy = dy * 0.15;
            } else if (this.type === 'victim') {
                const killer = squares.find(s => s.type === 'killer');
                let dist = Math.hypot(this.x - killer.x, this.y - killer.y);
                if (dist < 100) {
                    let ang = Math.atan2(this.y - killer.y, this.x - killer.x);
                    this.vx += Math.cos(ang) * 0.4;
                    this.vy += Math.sin(ang) * 0.4;
                }
                this.vx *= 0.97; this.vy *= 0.97;
            }

            this.x += this.vx; this.y += this.vy;
            
            // Wall Collision Logic
            const walls = gameMode === 'race' ? levels[currentLevel-1].walls : [
                {x: 10, y: 10, w: 10, h: 660}, {x: 360, y: 10, w: 10, h: 660},
                {x: 10, y: 10, w: 360, h: 10}, {x: 10, y: 660, w: 360, h: 10}
            ];

            walls.forEach(w => {
                if(this.x < w.x + w.w && this.x + this.size > w.x && this.y < w.y + w.h && this.y + this.size > w.y) {
                    // Universal sound for everyone!
                    playHitSound(130 + Math.random() * 40);
                    
                    let overlapLeft = (this.x + this.size) - w.x;
                    let overlapRight = (w.x + w.w) - this.x;
                    let overlapTop = (this.y + this.size) - w.y;
                    let overlapBottom = (w.y + w.h) - this.y;
                    let min = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                    if(min === overlapLeft) { this.x = w.x - this.size; this.vx *= -1; }
                    else if(min === overlapRight) { this.x = w.x + w.w; this.vx *= -1; }
                    else if(min === overlapTop) { this.y = w.y - this.size; this.vy *= -1; }
                    else if(min === overlapBottom) { this.y = w.y + w.h; this.vy *= -1; }
                }
            });

            // Square-to-Square Collision Logic
            if (gameMode === 'race') {
                squares.forEach(other => {
                    if (other === this || other.dead || other.finished) return;
                    if (this.x < other.x + other.size && this.x + this.size > other.x &&
                        this.y < other.y + other.size && this.y + this.size > other.y) {
                        
                        // Sound for square collision
                        playHitSound(200 + Math.random() * 50);

                        let dx = (this.x + this.size / 2) - (other.x + other.size / 2);
                        let dy = (this.y + this.size / 2) - (other.y + other.size / 2);
                        
                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.vx = Math.abs(this.vx) * Math.sign(dx);
                            other.vx = Math.abs(other.vx) * Math.sign(-dx);
                        } else {
                            this.vy = Math.abs(this.vy) * Math.sign(dy);
                            other.vy = Math.abs(other.vy) * Math.sign(-dy);
                        }
                        
                        this.x += Math.sign(dx) * 1.5;
                        this.y += Math.sign(dy) * 1.5;
                    }
                });
            }

            if (gameMode === 'race') {
                const f = levels[currentLevel-1].finish;
                if(this.x > f.x && this.x < f.x + f.w && this.y > f.y && this.y < f.y + f.h) {
                    this.finished = true;
                    onRaceEnd(this.color, this.isCPU);
                }
            }
        }
        draw() {
            if (this.dead) return;
            this.trail.forEach((p, i) => {
                ctx.globalAlpha = (i / this.trail.length) * 0.3;
                ctx.fillStyle = this.color;
                ctx.fillRect(p.x, p.y, this.size, this.size);
            });
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.size, this.size);
            
            ctx.fillStyle = 'white';
            ctx.fillRect(this.x + this.size*0.15, this.y + this.size*0.2, this.size*0.3, this.size*0.4);
            ctx.fillRect(this.x + this.size*0.55, this.y + this.size*0.2, this.size*0.3, this.size*0.4);
            ctx.fillStyle = 'black';
            let ox = Math.sign(this.vx) * (this.size*0.08);
            let oy = Math.sign(this.vy) * (this.size*0.08);
            ctx.fillRect(this.x + this.size*0.25 + ox, this.y + this.size*0.3 + oy, this.size*0.1, this.size*0.15);
            ctx.fillRect(this.x + this.size*0.65 + ox, this.y + this.size*0.3 + oy, this.size*0.1, this.size*0.15);

            if (this.type === 'killer') {
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.moveTo(this.x + this.size, this.y + this.size/2);
                ctx.lineTo(this.x + this.size + 15, this.y + this.size/2 - 5);
                ctx.lineTo(this.x + this.size + 12, this.y + this.size/2 + 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            if (gameMode === 'race') {
                const picked = playerChoices.filter(p => !p.finished && p.color === this.color);
                if(picked.length > 0) {
                    const label = picked.map(p => p.id).join(',');
                    ctx.beginPath(); ctx.arc(this.x + this.size/2, this.y - 12, 10, 0, Math.PI*2);
                    ctx.fillStyle = this.color; ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = (this.color === '#ffff00' || this.color === '#00ff00') ? 'black' : 'white';
                    ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(label, this.x + this.size/2, this.y - 8);
                }
            }
        }
    }

    let squares = [];

    function initPlayers(num) {
        gameMode = 'race';
        totalPlayersCount = num;
        currentPlayerTurn = 1;
        playerChoices = [];
        document.getElementById('setup-menu').classList.add('hidden');
        document.getElementById('bet-menu').classList.remove('hidden');
        document.getElementById('lvl-status').classList.remove('hidden');
        document.getElementById('timer-box').classList.add('hidden');
        updateTurnTitle();
        updateTimeOfDay();
        renderUIPlayers();
    }

    function chooseColor(color) {
        playerChoices.push({ id: currentPlayerTurn, color: color, finished: false });
        renderUIPlayers();
        if (currentPlayerTurn < totalPlayersCount) { currentPlayerTurn++; updateTurnTitle(); }
        else startRace();
    }

    function startRace() {
        document.getElementById('overlay').classList.add('hidden');
        squares = [];
        const base = ['#ff0000', '#0000ff', '#00ff00', '#ffff00'];
        base.forEach(c => {
            const isPicked = playerChoices.some(p => p.color === c && !p.finished);
            squares.push(new Square(c, !isPicked, 'normal'));
        });
        if (totalPlayersCount === 4) {
            ['#555','#888','#aaa','#ccc'].forEach(c => squares.push(new Square(c, true, 'normal')));
        }
        gameRunning = true;
    }

    function onRaceEnd(winColor, isCPU) {
        gameRunning = false;
        const winners = playerChoices.filter(p => !p.finished && p.color === winColor);
        winners.forEach(p => p.finished = true);
        
        document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('result-menu').classList.remove('hidden');
        document.getElementById('rematch-btn').classList.remove('hidden');
        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');

        if (isCPU) { 
            title.innerText = "CPU Victory! 🤖"; 
            desc.innerText = "A CPU-controlled square won the race."; 
        } else { 
            title.innerText = "Winner! 🎉"; 
            desc.innerText = `Player(s) ${winners.map(w=>w.id).join(',')} reached the goal!`; 
        }
        renderUIPlayers();
    }

    function startKillerMode() {
        gameMode = 'killer';
        document.getElementById('setup-menu').classList.add('hidden');
        document.getElementById('lvl-status').classList.add('hidden');
        document.getElementById('timer-box').classList.remove('hidden');
        document.getElementById('choices-bar').innerHTML = '';
        
        squares = [];
        squares.push(new Square('#ff0000', false, 'killer'));
        for(let i=0; i<100; i++) {
            let s = new Square('#00ccff', true, 'victim');
            s.x = Math.random() * 340 + 20;
            s.y = Math.random() * 640 + 20;
            squares.push(s);
        }

        killerTimer = 60;
        document.getElementById('sec-left').innerText = killerTimer;
        document.getElementById('overlay').classList.add('hidden');

        clearInterval(killerInterval);
        killerInterval = setInterval(() => {
            killerTimer--;
            document.getElementById('sec-left').innerText = killerTimer;
            if (killerTimer <= 0) endKiller(false);
        }, 1000);
        gameRunning = true;
    }

    function checkKillerHits() {
        const killer = squares.find(s => s.type === 'killer');
        squares.forEach(s => {
            if (s.type === 'victim' && !s.dead) {
                let dist = Math.hypot(s.x - killer.x, s.y - killer.y);
                if (dist < (s.size + killer.size) * 0.45) {
                    s.dead = true;
                    playHitSound(80);
                }
            }
        });
        if (squares.filter(s => s.type === 'victim' && !s.dead).length === 0) endKiller(true);
    }

    function endKiller(won) {
        gameRunning = false;
        clearInterval(killerInterval);
        document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('result-menu').classList.remove('hidden');
        document.getElementById('rematch-btn').classList.add('hidden');
        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        if (won) { 
            title.innerText = "Killer Wins! 🔪"; 
            desc.innerText = "You caught everyone in time!"; 
        } else { 
            title.innerText = "Time Over! ⏰"; 
            desc.innerText = `${squares.filter(s=>s.type==='victim'&&!s.dead).length} survivors left.`; 
        }
    }

    function nextGameAction() {
        document.getElementById('result-menu').classList.add('hidden');
        if (gameMode === 'killer') document.getElementById('setup-menu').classList.remove('hidden');
        else {
            const rem = playerChoices.filter(p => !p.finished).length;
            if (rem === 0) {
                currentLevel++;
                document.getElementById('lvl-display').innerText = currentLevel;
                initPlayers(totalPlayersCount);
            } else startRace();
        }
    }

    function resetCurrentLevelChoices() { 
        initPlayers(totalPlayersCount); 
        document.getElementById('result-menu').classList.add('hidden'); 
    }
    
    function updateTurnTitle() { 
        document.getElementById('turn-title').innerText = `Player ${currentPlayerTurn}: Pick a Color`; 
    }
    
    function renderUIPlayers() {
        const bar = document.getElementById('choices-bar');
        bar.innerHTML = '';
        playerChoices.forEach(p => {
            const icon = document.createElement('div');
            icon.className = 'player-icon-ui'; icon.style.backgroundColor = p.color;
            icon.style.opacity = p.finished ? '0.3' : '1'; icon.innerText = p.id;
            bar.appendChild(icon);
        });
    }

    function updateTimeOfDay() {
        const container = document.getElementById('container');
        const timeDisplay = document.getElementById('time-display');
        container.classList.remove('morning', 'noon', 'night');
        const cycle = Math.floor((currentLevel - 1) / 3) % 3;
        if (cycle === 0) { container.classList.add('morning'); timeDisplay.innerText = "Morning"; }
        else if (cycle === 1) { container.classList.add('noon'); timeDisplay.innerText = "Noon"; }
        else { container.classList.add('night'); timeDisplay.innerText = "Night"; }
    }

    function handleInput(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        const cy = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
        mouseX = cx - rect.left; mouseY = cy - rect.top;
    }
    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchmove', handleInput);

    function loop() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.globalAlpha = 0.4; ctx.fillStyle = '#fff'; ctx.fillRect(10, 10, 360, 660); ctx.globalAlpha = 1.0;

        const walls = gameMode === 'race' ? levels[currentLevel-1].walls : [
            {x: 10, y: 10, w: 10, h: 660}, {x: 360, y: 10, w: 10, h: 660},
            {x: 10, y: 10, w: 360, h: 10}, {x: 10, y: 660, w: 360, h: 10}
        ];
        ctx.fillStyle = '#444';
        walls.forEach(w => {
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = '#222'; ctx.strokeRect(w.x, w.y, w.w, w.h);
        });

        if (gameMode === 'race') {
            const f = levels[currentLevel-1].finish;
            ctx.fillStyle = 'black'; ctx.fillRect(f.x, f.y, f.w, f.h);
            ctx.fillStyle = '#0f0'; ctx.fillRect(f.x, f.y + f.h/2, f.w, f.h/2);
        }

        if (gameRunning) {
            squares.forEach(s => s.update());
            if (gameMode === 'killer') checkKillerHits();
        }
        squares.forEach(s => s.draw());
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
